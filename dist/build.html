<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#141915">
  <meta name="description" content="Create and save your own Journeys in Middle-earth hero builds.">
  <title>Create a build · Journeys</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="build.css">
  <link rel="stylesheet" href="build-flow.css">
  <script type="module" src="build.js"></script>
</head>
<body class="creator-page">
  <header class="build-toolbar" aria-label="Build controls">
    <a class="plain-button" href="index.html" aria-label="Back to card review">←</a>
    <input id="build-name" maxlength="100" placeholder="Build name" aria-label="Build name" autocomplete="off" disabled>
    <select id="saved-builds" aria-label="Saved builds" disabled><option value="">Choose a saved build</option></select>
    <button class="plain-button" id="new-build" type="button" aria-label="New build">+</button>
    <label class="plain-button import-button" aria-label="Import build">⇧<input id="import-build" type="file" accept=".json,application/json" aria-label="Import build file" hidden></label>
    <button id="save-build" class="plain-button" type="button" aria-label="Save build" disabled>✓</button>
    <button id="export-build" class="plain-button" type="button" aria-label="Export build" disabled>⇩</button>
  </header>
  <main class="creator-main">
    <p class="creator-loading" id="loading" role="status">Gathering the cards…</p>
    <div id="creator-flow" class="build-flow"></div>
  </main>
  <dialog id="preview-dialog" class="build-image-preview" aria-label="Card image"><button id="close-preview" class="icon-button" type="button" aria-label="Close card image">×</button><img id="preview-image" alt=""></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
