<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#141915">
  <meta name="description" content="Browse and share Journeys in Middle-earth builds.">
  <title>Journeys builds</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23141915'/%3E%3Cpath d='M16 14h32v36H16z' fill='%23d8bd78' stroke='%23f1dfad' stroke-width='2'/%3E%3Cpath d='M23 23h18M23 29h18M23 35h13' stroke='%233f4d37' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="build-flow.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="topbar">
    <nav class="view-tabs" aria-label="Views">
      <button type="button" class="view-tab active" data-view="builds" aria-current="page">Builds</button>
      <a class="view-tab create-build-link" href="build.html" aria-label="Create build" title="Create build">+</a>
    </nav>
    <div id="build-filters" class="topbar-filters">
      <label class="search-wrap"><span aria-hidden="true">⌕</span><input id="build-search" type="search" placeholder="Search builds" aria-label="Search builds"></label>
      <div id="build-sort" class="sort-segments" role="radiogroup" aria-label="Order builds">
        <button type="button" class="build-segment" role="radio" data-value="favorite" aria-checked="true">Favorites</button>
        <button type="button" class="build-segment" role="radio" data-value="hero" aria-checked="false" tabindex="-1">Hero</button>
        <button type="button" class="build-segment" role="radio" data-value="role" aria-checked="false" tabindex="-1">Role</button>
      </div>
    </div>
    <div id="card-filters" class="topbar-filters" hidden>
      <label class="search-wrap"><span aria-hidden="true">⌕</span><input id="card-search" type="search" placeholder="Search cards" aria-label="Search cards"></label>
      <div id="card-sort" class="sort-segments" role="radiogroup" aria-label="Order cards">
        <button type="button" class="build-segment" role="radio" data-value="original" aria-checked="true">Original</button>
        <button type="button" class="build-segment" role="radio" data-value="card-order" aria-checked="false" tabindex="-1">Card order</button>
        <button type="button" class="build-segment" role="radio" data-value="category-subcategory" aria-label="Category and subcategory" aria-checked="false" tabindex="-1">Category</button>
        <button type="button" class="build-segment" role="radio" data-value="title-asc" aria-label="Title A–Z" aria-checked="false" tabindex="-1">A–Z</button>
        <button type="button" class="build-segment" role="radio" data-value="title-desc" aria-label="Title Z–A" aria-checked="false" tabindex="-1">Z–A</button>
      </div>
    </div>
    <div class="header-actions" hidden>
      <button type="button" class="plain-button" id="export-button">Export review</button>
      <button type="button" class="plain-button" id="export-data-button" title="Download the full site data, including this browser's edits">Export site data</button>
      <label class="plain-button import-button">Import review<input id="import-input" type="file" accept="application/json,.json" hidden></label>
    </div>
    <div class="account-actions">
      <button type="button" class="plain-button" data-account-auth disabled>Sign in with Google</button>
    </div>
    <button type="button" class="view-tab edit-cards-link" data-view="gallery">Edit cards</button>
  </header>

  <div id="cloud-controls" class="cloud-controls" aria-label="Cloud saving" hidden>
    <span data-cloud-status role="status" aria-live="polite"></span>
    <button type="button" class="plain-button" data-cloud-auth disabled>Sign in with Google</button>
    <button type="button" class="plain-button" data-cloud-upload hidden>Upload browser edits</button>
    <button type="button" class="plain-button" data-cloud-retry hidden>Retry cloud save</button>
  </div>

  <main>
    <section id="builds-view" class="builds-view" aria-label="Saved builds">
      <button id="local-build-transfer" class="plain-button" type="button" hidden>Transfer browser-saved builds</button>
      <ul id="saved-build-list" class="saved-build-list"></ul>
      <p id="build-list-empty" class="empty-state" role="status">Loading saved builds…</p>
    </section>

    <section id="gallery-view" class="workspace" aria-label="Card gallery" hidden>
      <aside class="sidebar">
        <div class="sidebar-heading">Browse cards</div>
        <nav id="category-list" class="category-list" aria-label="Card categories"></nav>
      </aside>
      <div class="gallery-panel">
        <div class="gallery-meta"><span class="result-meta" id="result-meta" aria-live="polite"></span><span id="current-card-label" aria-live="polite"></span></div>
        <div id="gallery" class="card-grid"></div>
        <div id="gallery-empty" class="empty-state" hidden>No cards match these filters.</div>
      </div>
    </section>

  </main>

  <dialog id="card-dialog" class="card-dialog" aria-label="Card details">
    <div class="dialog-shell">
      <div class="dialog-top"><span id="dialog-counter"></span><button type="button" id="close-dialog" class="icon-button" aria-label="Close card">×</button></div>
      <div class="dialog-content">
        <div class="dialog-art"><img id="dialog-image" alt=""></div>
        <div class="dialog-info">
          <div class="eyebrow" id="dialog-category"></div>
          <label class="detail-label title-label" for="dialog-title-input">Title</label>
          <input id="dialog-title-input" class="card-title-input" type="text" autocomplete="off" aria-label="Card title">
          <div id="dialog-scan-wrap" hidden><label class="detail-label" for="dialog-scan">Image source</label><select id="dialog-scan" class="card-subcategory-input"></select></div>
          <label class="detail-label card-text-label" for="dialog-card-text">Card text</label>
          <textarea id="dialog-card-text" class="card-text-input" rows="10" placeholder="Type the text from this card"></textarea>
          <div class="detail-label">Category</div>
          <div id="dialog-categories" class="category-choices"></div>
          <div id="dialog-subcategory-wrap" hidden><label class="detail-label" id="dialog-subcategory-label">Subcategory</label><select id="dialog-subcategory-select" aria-label="Subcategory"></select><input id="dialog-subcategory-input" class="card-subcategory-input" type="text" aria-label="Subcategory"></div>
          <div id="dialog-order-wrap"><label class="detail-label" for="dialog-order-input">Order</label><input id="dialog-order-input" class="card-subcategory-input" type="number" min="0" step="1" placeholder="Unassigned" aria-label="Card order"></div>
          <div class="detail-label">Source</div>
          <button type="button" id="source-button" class="source-link"></button>
          <button type="button" id="delete-card" class="delete-card-button">Delete card</button>
          <div class="dialog-nav"><button type="button" id="prev-card">← Previous</button><button type="button" id="next-card">Next →</button></div>
        </div>
      </div>
    </div>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
