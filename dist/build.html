<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#141915">
  <meta name="description" content="Create and save your own Journeys in Middle-earth hero builds.">
  <title>Build · Journeys</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="build.css">
  <link rel="stylesheet" href="build-flow.css">
  <script type="module" src="build.js"></script>
</head>
<body class="creator-page">
  <header class="topbar">
    <nav class="view-tabs" aria-label="Views"><a class="view-tab" href="index.html">Builds</a><a class="view-tab create-build-link" href="build.html" aria-label="Create build" title="Create build">+</a></nav>
    <div class="build-toolbar" role="group" aria-label="Build controls">
      <input id="build-name" maxlength="100" placeholder="Build name" aria-label="Build name" autocomplete="off" disabled>
      <button id="save-build" class="plain-button" type="button" disabled>Save</button>
      <button id="copy-build" class="plain-button" type="button" hidden>Create a copy</button>
      <button id="reload-build" class="plain-button" type="button" hidden>Reload saved build</button>
      <button id="delete-build" class="plain-button" type="button" hidden>Delete</button>
    </div>
    <div class="account-actions"><button type="button" class="plain-button" data-account-auth disabled>Sign in with Google</button><a class="view-tab" href="index.html#cards">Edit cards</a></div>
  </header>
  <div id="cloud-controls" class="cloud-controls" aria-label="Cloud catalog" hidden>
    <span data-cloud-status role="status" aria-live="polite"></span>
    <button type="button" class="plain-button" data-cloud-auth disabled>Sign in with Google</button>
    <button type="button" class="plain-button" data-cloud-upload hidden>Upload browser edits</button>
    <button type="button" class="plain-button" data-cloud-retry hidden>Retry cloud save</button>
  </div>
  <main class="creator-main">
    <div class="build-details">
      <span id="build-owner" class="build-owner"></span>
      <span id="build-save-status" role="status" aria-live="polite">Loading…</span>
    </div>
    <button id="local-build-transfer" class="plain-button" type="button" hidden>Transfer browser-saved builds</button>
    <p class="creator-loading" id="loading" role="status">Gathering the cards…</p>
    <p id="build-warning" class="build-warning" role="status" hidden></p>
    <div id="creator-flow" class="build-flow"></div>
    <label id="build-notes-label" class="build-notes" hidden>Notes<textarea id="build-notes" maxlength="10000" rows="3"></textarea></label>
    <div hidden>
      <button id="export-build" type="button">Export build</button>
      <input id="import-build" type="file" accept=".json,application/json" aria-label="Import build file">
    </div>
  </main>
  <dialog id="preview-dialog" class="build-image-preview" aria-label="Card image"><button id="close-preview" class="icon-button" type="button" aria-label="Close card image">×</button><img id="preview-image" alt=""></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
